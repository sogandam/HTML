<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayit Ol</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Kayit Ol</h1></div></header>
    <main>
        <div class="container">
            <form id="registerForm" onsubmit="return validateRegisterForm()">
                <label for="name">Ad:</label>
                <input type="text" id="name" placeholder="Adinizi girin" required>
                <label for="surname">Soyad:</label>
                <input type="text" id="surname" placeholder="Soyadinizi girin" required>
                <label for="email">E-posta:</label>
                <input type="email" id="email" placeholder="E-posta adresinizi girin" required>
                <label for="username">Kullanici Adi:</label>
                <input type="text" id="username" placeholder="Kullanici adinizi girin" required>
                <label for="password">Şifre:</label>
                <input type="password" id="password" placeholder="Şifrenizi oluşturun" required>
                <button type="submit">Kayit Ol</button>
            </form>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 Üyelik Sistemi. Tüm Haklari Saklidir.</p>
        </div>
    </footer>
    <script src="js/validation.js"></script>
</body>
</html>
