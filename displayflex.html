<!DOCTYPE html>

    <head>
        <title>sogand</title>
        <style>
            .circle{
                width: 50px;
                height: 100px;
                border-radius: 50%;

            }
            #main{
                width: 450px;
                height: 200px;
                display: flex;
                border: 1px solid grey;
                flex-direction: row;
                flex-wrap:nowrap ;
                justify-content: left;
            }
            #main2{
                width: 450px;
                height: 200px;
                display: flex;
                border: 1px solid grey;
                flex-direction: column;
                flex-wrap:nowrap ;
                align-items: center;
            }

        </style>
    </head>
    <body>
        <div id="main">
            <div class="circle" style="background-color: orangered;">O</div>

            <div class="circle" style="background-color: yellow;">Y</div>
            <div class="circle" style="background-color: red;">R</div>
        </div>
        <div id="main2">
            <div class="circle" style="background-color: orangered;">O</div>
            <div class="circle" style="background-color: green;">G</div>
            <div class="circle" style="background-color: blue;">B</div>

            <div class="circle" style="background-color: red;">R</div>
        </div>

</html>
