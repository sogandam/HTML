<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Değiştir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Şifre Değiştir</h1>
        </div>
    </header>
    <main>
        <div class="container">
            <form id="changePasswordForm" onsubmit="return changePassword()">
                <label for="currentPassword">Mevcut Şifre:</label>
                <input type="password" id="currentPassword" placeholder="Mevcut şifrenizi girin" required>

                <label for="newPassword">Yeni Şifre:</label>
                <input type="password" id="newPassword" placeholder="Yeni şifrenizi oluşturun" required>

                <button type="submit">Değiştir</button>
            </form>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 Üyelik Sistemi. Tüm Haklari Saklidir.</p>
        </div>
    </footer>
    <script src="js/validation.js"></script>
</body>
</html>
