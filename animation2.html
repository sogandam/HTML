<!DOCTYPE html>
<html>
    <head>
        <title>sogand</title>
        <style>
            #city{
                width: 100%;
                height: 700px;
                background-image: url("city.jpg");
                background-position: center;
                background-size: cover;
                background-repeat: no-repeat;
                position: relative;
                overflow-x: hidden;
            }
            #road{
                width: 5000px;
                height: 300px;
                background-image: url("road.jpg");
                background-position: center;
                background-size: cover;
                background-repeat: no-repeat;
                position: absolute;
                overflow: hidden;
                bottom: 0;
                z-index: 1;
                display: block;
                animation: road 15s linear infinite;
            }
            @keyframes road{
                100%{
                    transform: translateX(-1000px);
                }
            }
            #car{
                width: 900px;
                left: 100px;
                position: absolute;
                z-index: 2;
                bottom: 30px;
            }
            #car img{
                animation: car 2s linear infinite;
            }
            @keyframes car{
                0%{
                    transform: translateY(2px);
                }
                50%{
                    transform: translateY(-2px);
                }
                100%{
                    transform: translateY(2px);
                }
            }
        </style>
    </head>
    <body>
        <div id="city">
            <div id="road"></div>
            <div id="car">
                <img src="car.png" alt="">
            </div>
        </div>
    </body>
</html>
